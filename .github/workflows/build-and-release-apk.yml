name: Compilar APK con Capacitor

on:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Construir APK de Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias web
        run: npm install

      - name: Construir la aplicación web
        run: npm run build

      - name: Configurar Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Compilar el APK (Modo Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Subir el APK a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
