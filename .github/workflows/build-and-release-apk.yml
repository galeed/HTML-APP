name: Compilar y Publicar APK Permanente

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inicializar y Compilar Proyecto Android
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android
          # Cambia "Mi App" y "com.miusuario.miapp" por el nombre y paquete de tu proyecto:
          npx cap init "Mi App" "com.miusuario.miapp" --web-dir .
          npx cap add android
          cd android && ./gradlew assembleDebug


      - name: Preparar APK final
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/htmlapp-v1.0.apk


      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: output/htmlapp-v1.0.apk
          name: "Nueva Versión APK (${{ github.ref_name }})"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
