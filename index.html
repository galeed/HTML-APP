<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HTML App</title>
  
  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/abbott.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

  <!-- JS Beautify -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>

  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0d14;
      --bg-panel: #121824;
      --neon-cyan: #00f3ff;
      --neon-green: #00ff66;
      --neon-yellow: #ffcc00;
      --neon-magenta: #ff0055;
      --text-main: #e2e8f0;
      --text-dim: #64748b;
      --border-glow: rgba(0, 243, 255, 0.25);
      --font-code: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-glow);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 12px;
      height: 12px;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
      transform: rotate(45deg);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
    }

    .brand-title span { color: var(--neon-cyan); }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-run {
      background: var(--neon-green);
      color: #000;
      border: none;
      padding: 6px 16px;
      font-weight: 900;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
      transition: all 0.2s;
    }

    .btn-run:active { transform: scale(0.96); }

    .view-mode-selector {
      display: flex;
      gap: 2px;
      background: rgba(0, 0, 0, 0.5);
      padding: 2px;
      border-radius: 4px;
      border: 1px solid var(--border-glow);
    }

    .icon-mode-btn {
      background: transparent;
      border: none;
      font-size: 1rem;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 3px;
      opacity: 0.5;
    }

    .icon-mode-btn.active {
      opacity: 1;
      background: rgba(0, 243, 255, 0.2);
    }

    .status-tag {
      font-size: 0.65rem;
      padding: 3px 6px;
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      border-radius: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* PESTAÑAS MÓVILES */
    .tabs {
      display: flex;
      background: #06080e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--neon-cyan);
      background: rgba(0, 243, 255, 0.05);
      border-bottom: 2px solid var(--neon-cyan);
    }

    /* ÁREA DE TRABAJO */
    .workspace {
      flex: 1;
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .panel {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }

    .panel.active { display: flex; }

    /* EDITOR */
    .editor-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #080a10;
    }

    .CodeMirror {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      font-family: var(--font-code);
      font-size: 0.85rem;
    }

    /* BARRA EDICIÓN VISUAL */
    .wysiwyg-bar {
      background: #121824;
      border-bottom: 1px solid var(--border-glow);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .wy-label {
      font-size: 0.65rem;
      color: var(--neon-cyan);
      font-weight: bold;
      margin-right: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .wy-btn {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--border-glow);
      color: #fff;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
    }

    .wy-btn:active { background: var(--neon-cyan); color: #000; }

    .wy-select {
      background: #0a0d14;
      border: 1px solid var(--border-glow);
      color: var(--text-main);
      padding: 4px;
      font-size: 0.75rem;
      border-radius: 3px;
    }

    .wy-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .preview-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    iframe#preview-output {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
      background: #ffffff;
    }

    /* BARRA DE ACCIONES */
    .action-bar {
      padding: 8px 10px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-glow);
      display: flex;
      gap: 6px;
      z-index: 10;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      padding: 10px 2px;
      border: none;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.68rem;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .btn-copy { background: rgba(0, 243, 255, 0.12); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
    .btn-paste { background: rgba(255, 204, 0, 0.12); border: 1px solid var(--neon-yellow); color: var(--neon-yellow); }
    .btn-clear { background: rgba(255, 0, 85, 0.12); border: 1px solid var(--neon-magenta); color: var(--neon-magenta); }
    .btn-load { background: rgba(0, 255, 102, 0.12); border: 1px solid var(--neon-green); color: var(--neon-green); }
    .btn-primary { background: linear-gradient(135deg, var(--neon-cyan), #0088ff); color: #000; font-weight: 900; }

    .dropdown-container { position: relative; flex: 1; display: flex; }
    .dropdown-menu {
      display: none;
      position: absolute;
      bottom: 115%;
      right: 0; left: 0;
      background: #0d121d;
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
      flex-direction: column;
      z-index: 20;
    }
    .dropdown-menu.show { display: flex; }
    .dropdown-item {
      padding: 10px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .dropdown-item:hover { background: rgba(0, 243, 255, 0.15); color: var(--neon-cyan); }

    /* LAYOUT ADAPTATIVO */
    body.mode-desktop .tabs { display: none !important; }
    body.mode-desktop .workspace { flex-direction: row !important; }
    body.mode-desktop .panel { position: relative !important; display: flex !important; flex: 1 !important; width: 50% !important; }
    body.mode-desktop .panel:first-child { border-right: 1px solid var(--border-glow); }

    body.mode-mobile .tabs { display: flex !important; }
    body.mode-mobile .workspace { flex-direction: column !important; }
    body.mode-mobile .panel { position: absolute !important; display: none; width: 100% !important; }
    body.mode-mobile .panel.active { display: flex !important; }

    @media (min-width: 768px) {
      body:not(.mode-mobile) .tabs { display: none; }
      body:not(.mode-mobile) .workspace { flex-direction: row; }
      body:not(.mode-mobile) .panel { position: relative; display: flex !important; flex: 1; width: 50%; }
      body:not(.mode-mobile) .panel:first-child { border-right: 1px solid var(--border-glow); }
    }
  </style>
</head>
<body class="mode-desktop">

  <input type="file" id="file-input" accept=".html,.htm,.txt" style="display: none;" onchange="handleFileUpload(event)">
  <input type="file" id="img-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

  <header>
    <div class="brand">
      <div class="brand-logo"></div>
      <div class="brand-title">HTML <span>APP</span></div>
    </div>
    
    <div class="header-controls">
      <button class="btn-run" onclick="updatePreview(true)" title="Ejecutar Código">
        ▶ EJECUTAR
      </button>
      <div id="status-tag" class="status-tag">LISTO</div>
      <div class="view-mode-selector">
        <button id="btn-mode-mobile" class="icon-mode-btn" title="Modo Móvil" onclick="setDeviceMode('mobile')">📱</button>
        <button id="btn-mode-desktop" class="icon-mode-btn" title="Modo Escritorio" onclick="setDeviceMode('desktop')">🖥️</button>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('editor')">&lt;/&gt; CÓDIGO</button>
    <button class="tab-btn" onclick="switchTab('preview')">&#128065; VISTA VISUAL</button>
  </div>

  <div class="workspace">
    <!-- PANEL IZQUIERDO: EDITOR DE CÓDIGO -->
    <div id="panel-editor" class="panel active">
      <div class="editor-container">
        <textarea id="code-input"></textarea>
      </div>
    </div>

    <!-- PANEL DERECHO: VISTA PREVIA Y EDICIÓN VISUAL -->
    <div id="panel-preview" class="panel active">
      <div class="preview-wrapper">
        <div class="wysiwyg-bar">
          <span class="wy-label">Texto:</span>
          <select class="wy-select" onchange="execWysiwygArgs('fontName', this.value); this.selectedIndex=0;" title="Fuente">
            <option value="" disabled selected>Fuente</option>
            <option value="Arial">Arial</option>
            <option value="Verdana">Verdana</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Impact">Impact</option>
          </select>

          <select class="wy-select" onchange="execWysiwygArgs('fontSize', this.value); this.selectedIndex=0;" title="Tamaño de Letra">
            <option value="" disabled selected>Tamaño</option>
            <option value="1">1 (Muy pequeña)</option>
            <option value="2">2 (Pequeña)</option>
            <option value="3">3 (Normal)</option>
            <option value="4">4 (Mediana)</option>
            <option value="5">5 (Grande)</option>
            <option value="6">6 (Muy grande)</option>
            <option value="7">7 (Enorme)</option>
          </select>

          <button class="wy-btn" onclick="execWysiwyg('bold')" title="Negrita"><b>B</b></button>
          <button class="wy-btn" onclick="execWysiwyg('italic')" title="Cursiva"><i>I</i></button>
          <button class="wy-btn" onclick="execWysiwyg('underline')" title="Subrayado"><u>U</u></button>
          
          <select class="wy-select" onchange="execWysiwygArgs('formatBlock', this.value); this.selectedIndex=0;">
            <option value="" disabled selected>Encabezado</option>
            <option value="<h1>">Título H1</option>
            <option value="<h2>">Título H2</option>
            <option value="<h3>">Título H3</option>
            <option value="<p>">Párrafo Normal</option>
          </select>
          
          <input type="color" style="width: 28px; height: 24px; border: none; background: transparent; cursor: pointer;" title="Color del Texto" onchange="execWysiwygArgs('foreColor', this.value)">
          <button class="wy-btn" onclick="execWysiwyg('justifyLeft')">⬅</button>
          <button class="wy-btn" onclick="execWysiwyg('justifyCenter')">↔</button>
          <button class="wy-btn" onclick="execWysiwyg('justifyRight')">➡</button>

          <div class="wy-divider"></div>

          <span class="wy-label">Imagen:</span>
          <button class="wy-btn" onclick="insertImagePrompt()" title="Insertar Imagen vía URL">🖼️ URL</button>
          <button class="wy-btn" onclick="triggerImageUpload()" title="Subir Imagen Local">📁 Subir</button>
          <button class="wy-btn" onclick="resizeSelectedImage('50%')" title="Ancho 50%">50%</button>
          <button class="wy-btn" onclick="resizeSelectedImage('100%')" title="Ancho 100%">100%</button>
          <button class="wy-btn" onclick="promptImageSize()" title="Tamaño Personalizado">⚙️ px</button>
        </div>
        <iframe id="preview-output"></iframe>
      </div>
    </div>
  </div>

  <!-- BARRA DE ACCIONES INFERIOR -->
  <div class="action-bar">
    <button class="btn btn-copy" onclick="copyCode()">📋 COPIAR</button>
    <button class="btn btn-paste" onclick="pasteCode()">📌 PEGAR</button>
    <button class="btn btn-clear" onclick="clearCode()">&#128465; BORRAR</button>
    <button class="btn btn-load" onclick="triggerFileSelect()">📂 CARGAR</button>
    
    <div class="dropdown-container">
      <button class="btn btn-primary" onclick="toggleDownloadMenu()">
        &#128190; DESCARGAR &#9662;
      </button>
      <div id="download-menu" class="dropdown-menu">
        <button class="dropdown-item" onclick="downloadAs('html')">
          <span>Archivo Web</span> <strong>.HTML</strong>
        </button>
        <button class="dropdown-item" onclick="downloadAs('txt')">
          <span>Texto Plano</span> <strong>.TXT</strong>
        </button>
      </div>
    </div>
  </div>

  <script>
    const previewOutput = document.getElementById('preview-output');
    const statusTag = document.getElementById('status-tag');
    const fileInput = document.getElementById('file-input');
    const imgInput = document.getElementById('img-input');
    const STORAGE_KEY = 'html_app_code';
    const MODE_KEY = 'html_app_mode';

    const initialTemplate = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HTML App Document</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 30px;
      background-color: #f4f7f6;
      color: #333;
    }
    .box {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-left: 5px solid #00f3ff;
    }
    h1 { color: #121824; margin-bottom: 10px; }
    p { line-height: 1.6; font-size: 1.1rem; }
    img { max-width: 100%; height: auto; border-radius: 6px; margin: 10px 0; display: block; }
  </style>
</head>
<body>
  <div class="box">
    <h1>HTML App - Editor Interactivo</h1>
    <p>Haz clic directamente aquí en la vista previa para <b>escribir o modificar texto</b>. Puedes cambiar el tipo de fuente, tamaño o formato desde la barra superior.</p>
    <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=600&auto=format&fit=crop" alt="Cat" width="300">
  </div>
</body>
</html>`;

    const savedCode = localStorage.getItem(STORAGE_KEY) || initialTemplate;
    let selectedImageElement = null;

    // Inicialización del Editor CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById('code-input'), {
      mode: 'htmlmixed',
      theme: 'abbott',
      lineNumbers: true,
      lineWrapping: true,
      tabSize: 2
    });

    editor.setValue(savedCode);

    let isInternalSync = false;
    let liveDebounceTimer;

    // Evento de cambio en el código fuente
    editor.on('change', () => {
      if (isInternalSync) return;
      
      statusTag.textContent = 'EDITANDO...';
      statusTag.style.color = 'var(--neon-yellow)';

      clearTimeout(liveDebounceTimer);
      liveDebounceTimer = setTimeout(() => {
        updatePreview(false);
        localStorage.setItem(STORAGE_KEY, editor.getValue());
        statusTag.textContent = 'LISTO';
        statusTag.style.color = 'var(--neon-green)';
      }, 400);
    });

    // Actualiza el iframe desde el código
    function updatePreview(forceManual = false) {
      const code = editor.getValue();
      const iframeDoc = previewOutput.contentDocument || previewOutput.contentWindow.document;

      if (!iframeDoc) return;

      iframeDoc.open();
      iframeDoc.write(code);
      iframeDoc.close();

      // Habilitar edición directa y manejo de imágenes dentro del iframe
      setTimeout(() => {
        try {
          if (iframeDoc.body) {
            iframeDoc.body.contentEditable = "true";
            
            iframeDoc.body.oninput = () => syncVisualToCode(iframeDoc);
            iframeDoc.body.onkeyup = () => syncVisualToCode(iframeDoc);

            // Listener para selección e interactividad con imágenes
            iframeDoc.addEventListener('click', (e) => {
              if (e.target && e.target.tagName === 'IMG') {
                selectedImageElement = e.target;
                highlightImage(selectedImageElement, iframeDoc);
              } else {
                clearImageHighlight(iframeDoc);
              }
            });
          }
        } catch (e) {
          console.error("Error activando modo visual:", e);
        }
      }, 200);

      if (forceManual) {
        statusTag.textContent = 'EJECUTADO';
        setTimeout(() => { statusTag.textContent = 'LISTO'; }, 1200);
      }
    }

    function highlightImage(img, iframeDoc) {
      clearImageHighlight(iframeDoc);
      img.style.outline = "3px solid #00f3ff";
      img.style.cursor = "pointer";
    }

    function clearImageHighlight(iframeDoc) {
      const imgs = iframeDoc.querySelectorAll('img');
      imgs.forEach(i => i.style.outline = "none");
    }

    // Sincroniza desde la vista previa visual hacia el Editor
    function syncVisualToCode(iframeDoc) {
      isInternalSync = true;
      
      const clone = iframeDoc.documentElement.cloneNode(true);
      
      clone.removeAttribute('contenteditable');
      if (clone.querySelector('body')) {
        clone.querySelector('body').removeAttribute('contenteditable');
      }

      // Limpiar estilos de resaltado temporal de las imágenes
      const cloneImgs = clone.querySelectorAll('img');
      cloneImgs.forEach(img => {
        img.style.outline = '';
        img.style.cursor = '';
        if (!img.getAttribute('style')) img.removeAttribute('style');
      });

      let updatedHTML = '<!DOCTYPE html>\n' + clone.outerHTML;

      if (typeof html_beautify === 'function') {
        updatedHTML = html_beautify(updatedHTML, { indent_size: 2, wrap_line_length: 0 });
      }

      const scrollInfo = editor.getScrollInfo();
      editor.setValue(updatedHTML);
      editor.scrollTo(scrollInfo.left, scrollInfo.top);

      localStorage.setItem(STORAGE_KEY, updatedHTML);

      statusTag.textContent = 'VISUAL ➡ CODE';
      statusTag.style.color = 'var(--neon-cyan)';
      
      setTimeout(() => {
        isInternalSync = false;
        statusTag.textContent = 'LISTO';
        statusTag.style.color = 'var(--neon-green)';
      }, 300);
    }

    // Comandos de formateo WYSIWYG
    function execWysiwyg(command) {
      const iframeWin = previewOutput.contentWindow;
      iframeWin.focus();
      iframeWin.document.execCommand(command, false, null);
      syncVisualToCode(iframeWin.document);
    }

    function execWysiwygArgs(command, value) {
      const iframeWin = previewOutput.contentWindow;
      iframeWin.focus();
      iframeWin.document.execCommand(command, false, value);
      syncVisualToCode(iframeWin.document);
    }

    // HERRAMIENTAS DE EDICIÓN DE IMÁGENES
    function insertImagePrompt() {
      const url = prompt('Introduce la URL de la imagen:');
      if (url) {
        execWysiwygArgs('insertImage', url);
      }
    }

    function triggerImageUpload() {
      imgInput.click();
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        execWysiwygArgs('insertImage', e.target.result);
        imgInput.value = '';
      };
      reader.readAsDataURL(file);
    }

    function resizeSelectedImage(widthValue) {
      const iframeDoc = previewOutput.contentDocument || previewOutput.contentWindow.document;
      if (selectedImageElement) {
        selectedImageElement.style.width = widthValue;
        selectedImageElement.style.height = 'auto';
        syncVisualToCode(iframeDoc);
      } else {
        alert('Haz clic primero sobre una imagen en la vista previa para seleccionarla.');
      }
    }

    function promptImageSize() {
      const iframeDoc = previewOutput.contentDocument || previewOutput.contentWindow.document;
      if (selectedImageElement) {
        const currentW = selectedImageElement.offsetWidth || 300;
        const newWidth = prompt('Introduce el ancho en píxeles (ej: 250) o porcentaje (ej: 80%):', currentW);
        if (newWidth) {
          const formattedWidth = isNaN(newWidth) ? newWidth : `${newWidth}px`;
          selectedImageElement.style.width = formattedWidth;
          selectedImageElement.style.height = 'auto';
          syncVisualToCode(iframeDoc);
        }
      } else {
        alert('Haz clic primero sobre una imagen en la vista previa para seleccionarla.');
      }
    }

    // Cambio de vista Móvil / Escritorio
    function setDeviceMode(mode) {
      document.body.classList.remove('mode-mobile', 'mode-desktop');
      document.getElementById('btn-mode-mobile').classList.remove('active');
      document.getElementById('btn-mode-desktop').classList.remove('active');

      if (mode === 'mobile') {
        document.body.classList.add('mode-mobile');
        document.getElementById('btn-mode-mobile').classList.add('active');
        switchTab('editor');
      } else {
        document.body.classList.add('mode-desktop');
        document.getElementById('btn-mode-desktop').classList.add('active');
      }

      localStorage.setItem(MODE_KEY, mode);
      setTimeout(() => editor.refresh(), 100);
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));

      if (tabName === 'editor') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('panel-editor').classList.add('active');
        editor.refresh();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('panel-preview').classList.add('active');
        updatePreview();
      }
    }

    // Funciones de la barra de acciones
    function copyCode() {
      const code = editor.getValue();
      if (!code) return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => notify('COPIADO')).catch(() => fallbackCopy(code));
      } else {
        fallbackCopy(code);
      }
    }

    function fallbackCopy(text) {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      document.body.removeChild(area);
      notify('COPIADO');
    }

    function pasteCode() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(text => {
          if (text) {
            editor.setValue(text);
            updatePreview();
            notify('PEGADO');
          }
        }).catch(() => fallbackPaste());
      } else {
        fallbackPaste();
      }
    }

    function fallbackPaste() {
      const text = prompt('Pega tu código aquí:');
      if (text !== null) {
        editor.setValue(text);
        updatePreview();
        notify('PEGADO');
      }
    }

    function clearCode() {
      if (confirm('¿Deseas borrar todo el código?')) {
        editor.setValue('');
        localStorage.removeItem(STORAGE_KEY);
        updatePreview();
        notify('BORRADO');
      }
    }

    function triggerFileSelect() { fileInput.click(); }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        editor.setValue(e.target.result);
        updatePreview();
        notify('CARGADO');
      };
      reader.readAsText(file, 'UTF-8');
      fileInput.value = '';
    }

    function toggleDownloadMenu() {
      document.getElementById('download-menu').classList.toggle('show');
    }

    document.addEventListener('click', (e) => {
      const container = document.querySelector('.dropdown-container');
      if (container && !container.contains(e.target)) {
        document.getElementById('download-menu').classList.remove('show');
      }
    });

    function downloadAs(format) {
      document.getElementById('download-menu').classList.remove('show');
      const code = editor.getValue();
      const mime = format === 'html' ? 'text/html;charset=utf-8' : 'text/plain;charset=utf-8';
      const blob = new Blob(['\uFEFF' + code], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `codigo.${format}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function notify(text) {
      statusTag.textContent = text;
      statusTag.style.color = 'var(--neon-cyan)';
      setTimeout(() => {
        statusTag.textContent = 'LISTO';
        statusTag.style.color = 'var(--neon-green)';
      }, 1500);
    }

    // Inicialización
    const savedMode = localStorage.getItem(MODE_KEY) || (window.innerWidth < 768 ? 'mobile' : 'desktop');
    setDeviceMode(savedMode);
    updatePreview();
  </script>
</body>
</html>
